name: Tests

on:
  push:
    branches:
  pull_request:

# Cancel previous runs of the same PR but do not cancel previous runs on main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  K3D_VERSION: "v5.8.3"
  MODAL_ENVIRONMENT: thomas-dev

jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7
        with:
          activate-environment: true
          enable-cache: true

      - name: Install project
        run: uv sync --locked --all-extras --dev

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=$K3D_VERSION bash

      - name: Install modal_metaflow as a package
        run: inv wheel

      - name: Run tests
        run:
          pytest tests --sandbox-timeout 1800 --app-name modal-metaflow-ci-${{ github.run_id }} --no-argo --teardown
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_METAFLOW_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_METAFLOW_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
