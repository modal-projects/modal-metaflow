[project]
name = "modal-metaflow"
version = "0.1.0"
description = "A Metaflow plugin for running Flows on Modal"
readme = "README.md"
authors = [
    { name = "Jason Mancuso", email = "7891333+jvmncs@users.noreply.github.com" },
]
requires-python = ">=3.11"
dependencies = ["modal", "metaflow", "semver"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metaflow_extensions"]

[tool.pyright]
venvPath = "."
venv = ".venv"
